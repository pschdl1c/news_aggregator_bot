services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      - bot_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sqlite3, os; sqlite3.connect(os.getenv('DATABASE_PATH','./data/bot.db')).execute('SELECT 1')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  bot_data:
